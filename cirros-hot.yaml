#                content: |
#                          #!/bin/bash
#                          echo "hello" > /tmp/message-init.txt
#
#            runcmd:
#              - echo "Executing create_file"
#              - /tmp/create_file.sh
#              - reboot
#            bootcmd:
#              - echo "Boot Completed"

outputs:
  instance_name:
    description: "Name of the instance"
    value: { get_attr: [ my_instance, name ] }
  result:
    description: Checkoutput
    value: { get_attr: [deployment, name] }
  result2:
    description: Checkoutput
    value: { get_attr: [deployment, metadata] }
